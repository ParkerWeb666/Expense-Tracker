<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="container">
      <h1>Expense Tracker</h1>
      <nav class="menu">
        
        <a> <img src="./src/icons/menu/house.svg" alt="" />Главная </a>
        <a> <img src="./src/icons/menu/list.svg" alt="" />Расходы</a>
        <a> <img src="./src/icons/menu/chart-pie.svg" alt="" />Лимиты</a>
        <a> <img src="./src/icons/menu/settings.svg" alt="" />Настройки</a>
      </nav>

      <section class="summary">
        <p>Всего расходов</p>
        <strong id="total">0 ₽</strong>
      </section>
      <section class="statistics">
        <div class="statistics-head" id="set-limit">
          <h2>Статистика</h2>
          <button>Задать лимит</button>
        </div>
        <form id="set-limit-form">
          <ul id="limit-list"></ul>
          <button id="save-limit" type="submit">Сохранить</button>
        </form>
        <div id="statistics-list"></div>
        <div id="statistics-month"></div>
      </section>
      <form id="expense-form">
        <input id="expense-title" type="text" placeholder="Название расхода" />
        <p id="title-error"></p>
        <input id="expense-amount" type="number" placeholder="Сумма" />
        <p id="amount-error"></p>
        <select id="expense-category">
          <option value="food">Еда</option>
          <option value="transport">Транспорт</option>
          <option value="entertainment">Развлечения</option>
          <option value="other">Другое</option>
        </select>

        <button type="submit">Добавить</button>
      </form>
      <section class="history-expenses">
        <h2>История расходов</h2>
        <input id="search-input" type="text" placeholder="Поиск расхода..." />
        <select id="sort-select">
          <option value="new">Сначала новые</option>
          <option value="old">Сначала старые</option>
          <option value="price-asc">Цена ↑</option>
          <option value="price-desc">Цена ↓</option>
        </select>
        <ul id="expense-list"></ul>
      </section>
    </main>

    <script src="src/app.js" type="module"></script>
  </body>
</html>
